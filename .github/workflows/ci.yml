name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tests create and drop their own databases on this disposable server
# (TEST_DATABASE_URL); nothing here touches a real deployment.
env:
  TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Boot on an empty database (migrations run on start)
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/notes_smoke
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          COOKIE_SECURE: 'false'
          BACKGROUND_JOBS: 'false'
          PORT: '3004'
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE notes_smoke'
          node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null -X POST localhost:3004/api/auth/prelogin \
              -H 'Content-Type: application/json' -d '{"email":"ci@example.com"}' && break
            sleep 1
          done
          curl -sf -X POST localhost:3004/api/auth/prelogin \
            -H 'Content-Type: application/json' -d '{"email":"ci@example.com"}' | grep -q '"authMode":"e2ee"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3004/api/auth/me)" = 401
          npm run migrate -- --status
      - name: Server log
        if: always()
        run: cat server.log || true

  client:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      # The client's integration and browser tests run the real server.
      - run: npm ci
        working-directory: server
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: client/test-results
          retention-days: 7
